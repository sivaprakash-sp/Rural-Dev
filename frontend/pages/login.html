<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RuralFix & Agro MedKnow Nexus</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    body {
      height: 100vh;
      overflow: hidden;
      margin: 0;
      display: flex;
    }
    .split-layout {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .split-visual {
      flex: 1;
      background: linear-gradient(rgba(26, 77, 46, 0.7), rgba(26, 77, 46, 0.9)), url('https://images.unsplash.com/photo-1592982537447-6f2a6a0c5b36?auto=format&fit=crop&q=80') center/cover;
      display: none;
      flex-direction: column;
      justify-content: center;
      padding: 4rem;
      color: white;
    }
    @media (min-width: 1024px) {
      .split-visual { display: flex; }
    }
    .split-visual h1 { color: var(--color-accent); font-size: 3rem; margin-bottom: 1rem; }
    .split-visual p { font-size: 1.25rem; max-width: 500px; }
    
    .split-form {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem;
      background-color: var(--color-bg-main);
      overflow-y: auto;
    }
    .form-container {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }
    
    .form-header { margin-bottom: 2rem; text-align: center; }
    .form-header h2 { color: var(--color-primary); font-size: 2rem; }
    
    .role-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    @media (min-width: 768px) {
      .role-selector { grid-template-columns: repeat(5, 1fr); }
    }
    
    .role-btn {
      padding: 0.5rem;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      background-color: var(--color-bg-card);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-weight: 500;
      color: var(--color-text-main);
      transition: all var(--transition-fast);
    }
    .role-btn.active {
      background-color: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }
    
    .lang-selector {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
    }
    
    .back-link {
      margin-top: 1.5rem;
      display: inline-block;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="split-layout">
    <!-- Left Visual -->
    <div class="split-visual">
      <h1>Smarter Villages.<br>Smarter Farming.</h1>
      <p>Connect with your rural ecosystem, manage your crops intelligently, and build a better future together.</p>
    </div>
    
    <!-- Right Form -->
    <div class="split-form">
      <div class="lang-selector">English | தமிழ்</div>
      
      <div class="form-container">
        <div class="form-header">
          <h2>Welcome Back</h2>
          <p class="text-muted">Please sign in to your account</p>
        </div>
        
        <form action="farmer-dashboard.html" method="GET">
          
          <label class="form-label">Select Your Role</label>
          <div class="role-selector">
            <div class="role-btn active" onclick="selectRole(this)">Farmer</div>
            <div class="role-btn" onclick="selectRole(this)">Citizen</div>
            <div class="role-btn" onclick="selectRole(this)">Authority</div>
            <div class="role-btn" onclick="selectRole(this)">Worker</div>
            <div class="role-btn" onclick="selectRole(this)">Buyer</div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Mobile Number or Email</label>
            <input type="text" class="form-control" placeholder="Enter mobile or email" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Enter password" required>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block">Login</button>
          
          <div class="back-link">
            Don't have an account? <a href="register.html">Create Account</a><br>
            <a href="../index.html" class="text-muted" style="font-size: 0.9rem; margin-top: 1rem; display: inline-block;">← Back to Home</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function selectRole(element) {
      document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      
      // Determine redirection based on role (Simulation for static HTML)
      const form = document.querySelector('form');
      const role = element.innerText.toLowerCase();
      
      if(role === 'farmer') form.action = 'farmer-dashboard.html';
      if(role === 'citizen') form.action = 'ruralfix.html';
      if(role === 'authority') form.action = 'authority-dashboard.html';
      if(role === 'worker') form.action = 'worker-dashboard.html';
      if(role === 'buyer') form.action = 'buyers.html';
    }
  </script>
</body>
</html>
